<!doctype html><html lang="pt-BR" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>(()=>{const s=localStorage.getItem("transcritor-theme");document.documentElement.dataset.theme=s||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")})();</script>
<title>Transcritor de Aulas</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><main>
<header><div><small>WHISPER NA NUVEM</small><h1>Transcritor de Aulas</h1><p>Envie a aula inteira ou escolha somente um trecho.</p></div><button id="theme" class="icon" title="Alternar tema">◐</button></header>
<section class="card">
<div class="source-tabs" role="radiogroup" aria-label="Origem da mídia">
<label><input type="radio" name="source" value="file" checked><span>Arquivo</span></label>
<label><input type="radio" name="source" value="url"><span>Link direto</span></label>
</div>
<label class="drop" id="drop"><input id="file" type="file" accept="audio/*,video/*"><strong id="name">Arraste o arquivo para cá</strong><span id="hint">ou clique para selecionar</span><small id="info">Áudio ou vídeo</small></label>
<div id="urlBox" class="url-card" hidden>
<label>Link do vídeo
<input id="mediaUrl" type="url" placeholder="https://cdn.../video.mp4?...">
</label>
<small>Use um link direto para MP4/áudio. Links assinados podem expirar.</small>
</div>
<div class="mode">
<label><input type="radio" name="mode" value="all" checked> Aula inteira</label>
<label><input type="radio" name="mode" value="part"> Somente trecho</label>
</div>
<div id="times" class="interval-card" hidden>
<div class="interval-title"><strong>Intervalo da transcrição</strong><small>Informe o ponto inicial e final do trecho.</small></div>
<div class="times">
<label>Início <input id="start" value="00:00:00" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" placeholder="HH:MM:SS" aria-label="Horário inicial"></label>
<label>Fim <input id="end" value="00:10:00" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{2}:[0-9]{2}:[0-9]{2}" placeholder="HH:MM:SS" aria-label="Horário final"></label>
</div></div>
<div class="actions"><button id="go" disabled>Transcrever</button><button id="cancel" class="alt" hidden>Cancelar</button></div>
<div id="progressBox" hidden><div class="prow"><span id="status">Preparando…</span><span id="pct">0%</span></div><div class="bar"><div id="fill"></div></div><p id="detail"></p></div>
</section>
<section class="card" id="result" hidden><div class="head"><h2>Transcrição com horários</h2><div><button class="alt" id="copy">Copiar</button><button class="alt" id="txt">Baixar TXT</button><button class="alt" id="vtt">Baixar VTT</button></div></div><textarea id="text" spellcheck="false"></textarea></section>
<section class="card error" id="errorBox" hidden><strong>Falha</strong><p id="error"></p></section>
</main>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><script src="app.js"></script></body></html>
